name: validate

# The live reviewer fetches this repo at a pinned commit (AGENTS_REF in bruno's
# events-ingress) and parses the agent package with jq. There is no build
# artifact, so what gets pinned is exactly what runs. This workflow is the gate:
# every PR and every push to main must pass validation before a commit is
# eligible to be pinned.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent package
        run: ./scripts/validate.sh
